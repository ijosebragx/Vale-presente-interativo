<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Vale-Presente</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cream: #fdf6f0;
    --blush: #f5e6e0;
    --rose: #c9797a;
    --deep-rose: #8b3a3a;
    --gold: #b8975a;
    --gold-light: #d4b07a;
    --text-dark: #2c1f1f;
    --text-mid: #6b4f4f;
    --text-light: #a08080;
  }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--cream);
    font-family: 'Montserrat', sans-serif;
  }

  /* ── ADMIN PANEL ── */
  #admin-panel {
    position: fixed;
    inset: 0;
    background: #1a1212;
    color: #f5e6e0;
    z-index: 1000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 24px;
    gap: 0;
  }

  #admin-panel h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 28px;
    font-weight: 300;
    letter-spacing: 0.12em;
    color: var(--gold-light);
    margin-bottom: 6px;
    text-align: center;
  }

  #admin-panel p.subtitle {
    font-size: 11px;
    letter-spacing: 0.15em;
    color: #a08080;
    text-transform: uppercase;
    margin-bottom: 32px;
    text-align: center;
  }

  .field-group {
    width: 100%;
    max-width: 380px;
    margin-bottom: 18px;
  }

  .field-group label {
    display: block;
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 8px;
  }

  .field-group input, .field-group textarea {
    width: 100%;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(184,151,90,0.3);
    border-radius: 4px;
    color: #fdf6f0;
    font-family: 'Montserrat', sans-serif;
    font-size: 14px;
    padding: 12px 14px;
    outline: none;
    transition: border-color 0.2s;
  }

  .field-group input:focus, .field-group textarea:focus {
    border-color: var(--gold);
  }

  .field-group textarea {
    resize: none;
    height: 70px;
  }

  .field-group input::placeholder, .field-group textarea::placeholder {
    color: rgba(255,255,255,0.25);
  }

  #btn-gerar {
    margin-top: 8px;
    width: 100%;
    max-width: 380px;
    background: linear-gradient(135deg, var(--gold), var(--gold-light));
    color: #1a1212;
    border: none;
    border-radius: 4px;
    font-family: 'Montserrat', sans-serif;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding: 16px;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
  }

  #btn-gerar:active { transform: scale(0.98); opacity: 0.9; }

  /* ── MAIN EXPERIENCE ── */
  #experience {
    position: fixed;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--cream);
    overflow: hidden;
  }

  /* Noise texture overlay */
  #experience::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    background-size: 200px;
    pointer-events: none;
    z-index: 0;
    opacity: 0.6;
  }

  /* Radial blush gradient bg */
  .bg-glow {
    position: fixed;
    width: 70vmax;
    height: 70vmax;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(245,200,200,0.35) 0%, transparent 70%);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }

  /* ── COVER SCREEN ── */
  #screen-cover {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    cursor: pointer;
    user-select: none;
  }

  .studio-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 32px;
    opacity: 0;
    animation: fadeUp 0.8s 0.3s forwards;
  }

  .bow-container {
    position: relative;
    width: min(360px, 94vw);
    height: min(220px, 58vw);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    animation: fadeUp 0.8s 0.5s forwards;
  }

  #bow-svg {
    width: 100%;
    height: 100%;
    object-fit: contain;
    mix-blend-mode: multiply;
    filter: drop-shadow(0 16px 40px rgba(90,8,8,0.32));
    transition: transform 0.3s ease;
  }

  #screen-cover:hover #bow-svg {
    transform: scale(1.04);
  }

  /* bow-svg estilizado inline */

  .tap-hint {
    position: absolute;
    bottom: -8px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 9px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--gold);
    animation: pulse 2s infinite;
  }

  .tagline {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(22px, 6vw, 30px);
    font-weight: 300;
    font-style: italic;
    color: var(--deep-rose);
    text-align: center;
    margin-top: 36px;
    letter-spacing: 0.04em;
    opacity: 0;
    animation: fadeUp 0.8s 0.7s forwards;
    line-height: 1.3;
  }

  .tagline em {
    font-style: normal;
    font-weight: 600;
  }

  /* ── REVEAL SCREEN ── */
  #screen-reveal {
    display: none;
    position: absolute;
    inset: 0;
    z-index: 20;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 28px;
  }

  .voucher-card {
    background: white;
    border: 1px solid rgba(184,151,90,0.2);
    border-radius: 2px;
    width: 100%;
    max-width: 360px;
    padding: 40px 32px 36px;
    text-align: center;
    position: relative;
    box-shadow: 0 4px 60px rgba(140,60,60,0.08), 0 1px 4px rgba(0,0,0,0.04);
    opacity: 0;
    transform: translateY(30px) scale(0.96);
    transition: opacity 0.7s ease, transform 0.7s ease;
  }

  .voucher-card.visible {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  /* Top decorative line */
  .voucher-card::before {
    content: '';
    position: absolute;
    top: 0; left: 16px; right: 16px;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  .voucher-studio {
    font-family: 'Cormorant Garamond', serif;
    font-size: 13px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 4px;
  }

  .voucher-line {
    width: 40px;
    height: 1px;
    background: var(--gold-light);
    margin: 10px auto 16px;
  }

  .voucher-for {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(32px, 9vw, 44px);
    font-weight: 300;
    font-style: italic;
    color: var(--deep-rose);
    line-height: 1;
    margin-bottom: 6px;
  }

  .voucher-subtitle {
    font-size: 9px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-light);
    margin-bottom: 28px;
  }

  .voucher-proc-label {
    font-size: 8.5px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--text-light);
    margin-bottom: 4px;
  }

  .voucher-proc-value {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(20px, 5.5vw, 26px);
    font-weight: 600;
    color: var(--text-dark);
    letter-spacing: 0.04em;
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 1px solid rgba(0,0,0,0.06);
  }

  .voucher-validity-label {
    font-size: 8.5px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--text-light);
    margin-bottom: 4px;
  }

  .voucher-validity-value {
    font-family: 'Cormorant Garamond', serif;
    font-size: 18px;
    font-weight: 400;
    color: var(--text-mid);
  }

  .voucher-msg {
    font-size: 10px;
    letter-spacing: 0.08em;
    color: var(--text-light);
    font-style: italic;
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid rgba(0,0,0,0.05);
  }

  /* Bottom decorative */
  .voucher-card::after {
    content: '';
    position: absolute;
    bottom: 0; left: 16px; right: 16px;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  #btn-whatsapp {
    margin-top: 20px;
    width: 100%;
    max-width: 360px;
    background: #25d366;
    color: white;
    border: none;
    border-radius: 2px;
    font-family: 'Montserrat', sans-serif;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-decoration: none;
    opacity: 0;
    transform: translateY(16px);
    transition: opacity 0.5s 0.4s ease, transform 0.5s 0.4s ease, background 0.2s;
  }

  #btn-whatsapp.visible {
    opacity: 1;
    transform: translateY(0);
  }

  #btn-whatsapp:hover { background: #20b858; }

  #btn-whatsapp svg {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
  }

  /* ── ANIMATIONS ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.5; }
    50%       { opacity: 1; }
  }

  /* Bow open animation */
  @keyframes bowOpen {
    0%   { transform: scale(1) rotate(0deg); opacity: 1; }
    30%  { transform: scale(1.15) rotate(-3deg); }
    60%  { transform: scale(0.9) rotate(5deg); opacity: 0.6; }
    100% { transform: scale(0) rotate(10deg); opacity: 0; }
  }

  .bow-opening {
    animation: bowOpen 0.55s cubic-bezier(0.4, 0, 0.2, 1) forwards !important;
    transform-origin: center center;
  }

  /* Confetti petals */
  .petal {
    position: fixed;
    width: 8px;
    height: 8px;
    border-radius: 50% 0 50% 0;
    pointer-events: none;
    z-index: 100;
    animation: petalFall var(--dur) var(--delay) ease-in forwards;
  }

  @keyframes petalFall {
    0%   { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 1; }
    100% { transform: translate(var(--tx), var(--ty)) rotate(var(--rot)) scale(0.3); opacity: 0; }
  }
</style>
</head>
<body>

<!-- ═══════════════════════════════════════════ ADMIN PANEL -->
<div id="admin-panel">
  <h1>Vale-Presente</h1>
  <p class="subtitle">Configure e gere o link</p>

  <div class="field-group">
    <label>Nome do Studio / Clínica</label>
    <input type="text" id="f-studio" placeholder="Ex: Studio Bella" maxlength="40">
  </div>

  <div class="field-group">
    <label>Procedimento / Presente</label>
    <textarea id="f-proc" placeholder="Ex: Design de Sobrancelhas&#10;Sessão de Limpeza de Pele&#10;50% off em Extensão de Cílios"></textarea>
  </div>

  <div class="field-group">
    <label>Válido até</label>
    <input type="text" id="f-validade" placeholder="Ex: 30 de junho de 2025">
  </div>

  <div class="field-group">
    <label>Mensagem da presenteada (opcional)</label>
    <input type="text" id="f-nome" placeholder="Ex: Para a Juliana ✨">
  </div>

  <div class="field-group">
    <label>Número WhatsApp (com DDD)</label>
    <input type="tel" id="f-whatsapp" placeholder="Ex: 11999999999">
  </div>

  <button id="btn-gerar">Gerar Vale-Presente →</button>
</div>

    document.getElementById('display-studio').textContent = studio.toUpperCase();
    document.getElementById('v-studio').textContent = studio.toUpperCase();
    document.getElementById('v-proc').textContent = proc;
    document.getElementById('v-validade').textContent = validade;
    document.getElementById('v-nome').textContent = nome ? `para ${nome}` : 'para você';

    const wppMsg = encodeURIComponent(`Olá! Recebi um vale-presente do ${studio} e gostaria de agendar meu procedimento: ${proc}.`);
    document.getElementById('btn-whatsapp').href = `https://wa.me/55${wpp}?text=${wppMsg}`;

    // Mostra experience
    document.getElementById('admin-panel').style.display = 'none';
    const exp = document.getElementById('experience');
    exp.style.display = 'flex';
  });

  // ── BOW CLICK → REVEAL
  document.getElementById('screen-cover').addEventListener('click', openGift);

  function openGift() {
    const cover = document.getElementById('screen-cover');
    const bowSvg = document.getElementById('bow-svg');

    // Petals burst
    spawnPetals();

    // Animate bow out
    bowSvg.classList.add('bow-opening');

    setTimeout(() => {
      cover.style.display = 'none';

      const reveal = document.getElementById('screen-reveal');
      reveal.style.display = 'flex';

      // Staggered reveal
      requestAnimationFrame(() => {
        setTimeout(() => {
          document.getElementById('voucher-card').classList.add('visible');
          document.getElementById('btn-whatsapp').classList.add('visible');
        }, 50);
      });
    }, 550);
  }

  function spawnPetals() {
    const cx = window.innerWidth / 2;
    const cy = window.innerHeight / 2;
    const COUNT = 28;

    for (let i = 0; i < COUNT; i++) {
      setTimeout(() => {
        const canvas = document.createElement('canvas');
        const size = 38 + Math.random() * 42; // bigger petals
        canvas.width = size * 2;
        canvas.height = size * 2.2;
        canvas.style.cssText = `
          position: fixed;
          left: ${cx}px; top: ${cy}px;
          pointer-events: none;
          z-index: 999;
          transform-origin: center center;
        `;
        document.body.appendChild(canvas);

        const ctx = canvas.getContext('2d');
        drawRosePetal(ctx, size, canvas.width, canvas.height);

        // Physics
        const angle = (Math.random() * 340 - 170) * Math.PI / 180;
        const speed = 4 + Math.random() * 9;
        let vx = Math.cos(angle) * speed;
        let vy = Math.sin(angle) * speed - (3 + Math.random() * 4);
        let x = cx, y = cy;
        let rot = Math.random() * 360;
        let rotSpeed = (Math.random() - 0.5) * 8;
        let opacity = 1;
        const gravity = 0.18 + Math.random() * 0.1;
        const drag = 0.97;

        function tick() {
          vx *= drag; vy += gravity;
          x += vx; y += vy;
          rot += rotSpeed;
          opacity -= 0.012;

          canvas.style.left = x + 'px';
          canvas.style.top  = y + 'px';
          canvas.style.transform = `translate(-50%,-50%) rotate(${rot}deg)`;
          canvas.style.opacity = Math.max(0, opacity);

          if (opacity > 0 && y < window.innerHeight + 100) {
            requestAnimationFrame(tick);
          } else {
            canvas.remove();
          }
        }
        requestAnimationFrame(tick);
      }, i * 35);
    }
  }

  function drawRosePetal(ctx, size, W, H) {
    const cx = W / 2, cy = H / 2;

    // Petal color variation
    const hue = 340 + Math.random() * 25 - 12;
    const sat = 65 + Math.random() * 20;
    const baseColor  = `hsl(${hue}, ${sat}%, 42%)`;
    const midColor   = `hsl(${hue}, ${sat}%, 58%)`;
    const lightColor = `hsl(${hue}, ${sat - 10}%, 72%)`;
    const darkColor  = `hsl(${hue}, ${sat}%, 25%)`;
    const tipColor   = `hsl(${hue + 5}, ${sat - 5}%, 80%)`;

    ctx.save();

    // Petal shape - teardrop / rose petal form
    ctx.beginPath();
    ctx.moveTo(cx, cy + size * 0.9);
    ctx.bezierCurveTo(
      cx - size * 0.7, cy + size * 0.4,
      cx - size * 0.85, cy - size * 0.3,
      cx, cy - size * 0.95
    );
    ctx.bezierCurveTo(
      cx + size * 0.85, cy - size * 0.3,
      cx + size * 0.7, cy + size * 0.4,
      cx, cy + size * 0.9
    );
    ctx.closePath();

    // Main gradient fill
    const grad = ctx.createLinearGradient(cx - size * 0.6, cy - size * 0.9, cx + size * 0.4, cy + size * 0.9);
    grad.addColorStop(0,    tipColor);
    grad.addColorStop(0.18, lightColor);
    grad.addColorStop(0.45, midColor);
    grad.addColorStop(0.72, baseColor);
    grad.addColorStop(1,    darkColor);
    ctx.fillStyle = grad;
    ctx.fill();

    // Clip to petal shape for inner details
    ctx.save();
    ctx.clip();

    // Center vein
    ctx.beginPath();
    ctx.moveTo(cx, cy + size * 0.85);
    ctx.quadraticCurveTo(cx + size * 0.08, cy, cx, cy - size * 0.88);
    ctx.strokeStyle = `hsla(${hue}, ${sat}%, 30%, 0.35)`;
    ctx.lineWidth = size * 0.03;
    ctx.stroke();

    // Side veins left
    for (let v = 0; v < 4; v++) {
      const t = 0.1 + v * 0.2;
      const py = cy + size * 0.85 - t * size * 1.75;
      const px = cx + size * 0.04 * (0.5 - t);
      ctx.beginPath();
      ctx.moveTo(px, py);
      ctx.quadraticCurveTo(
        px - size * (0.15 + v * 0.06), py - size * 0.18,
        px - size * (0.28 + v * 0.1),  py - size * 0.05
      );
      ctx.strokeStyle = `hsla(${hue}, ${sat}%, 28%, 0.22)`;
      ctx.lineWidth = size * 0.018;
      ctx.stroke();
    }
    // Side veins right
    for (let v = 0; v < 4; v++) {
      const t = 0.1 + v * 0.2;
      const py = cy + size * 0.85 - t * size * 1.75;
      const px = cx + size * 0.04 * (0.5 - t);
      ctx.beginPath();
      ctx.moveTo(px, py);
      ctx.quadraticCurveTo(
        px + size * (0.15 + v * 0.06), py - size * 0.18,
        px + size * (0.28 + v * 0.1),  py - size * 0.05
      );
      ctx.strokeStyle = `hsla(${hue}, ${sat}%, 28%, 0.22)`;
      ctx.lineWidth = size * 0.018;
      ctx.stroke();
    }

    // Satin surface sheen
    const sheen = ctx.createRadialGradient(
      cx - size * 0.25, cy - size * 0.55, 0,
      cx - size * 0.1,  cy - size * 0.2,  size * 0.9
    );
    sheen.addColorStop(0,    'rgba(255,255,255,0.42)');
    sheen.addColorStop(0.3,  'rgba(255,255,255,0.14)');
    sheen.addColorStop(0.7,  'rgba(255,255,255,0.04)');
    sheen.addColorStop(1,    'rgba(255,255,255,0)');
    ctx.fillStyle = sheen;
    ctx.fill();

    // Subtle fold crease
    ctx.beginPath();
    ctx.moveTo(cx - size * 0.15, cy + size * 0.6);
    ctx.quadraticCurveTo(cx - size * 0.3, cy, cx - size * 0.1, cy - size * 0.5);
    ctx.strokeStyle = `hsla(${hue}, ${sat}%, 20%, 0.18)`;
    ctx.lineWidth = size * 0.025;
    ctx.stroke();

    ctx.restore();

    // Petal edge - soft darkening
    const edgeGrad = ctx.createLinearGradient(cx - size * 0.85, cy, cx + size * 0.85, cy);
    edgeGrad.addColorStop(0,   `hsla(${hue}, ${sat}%, 15%, 0.4)`);
    edgeGrad.addColorStop(0.15,'rgba(0,0,0,0)');
    edgeGrad.addColorStop(0.85,'rgba(0,0,0,0)');
    edgeGrad.addColorStop(1,   `hsla(${hue}, ${sat}%, 15%, 0.4)`);

    ctx.beginPath();
    ctx.moveTo(cx, cy + size * 0.9);
    ctx.bezierCurveTo(cx - size*0.7, cy+size*0.4, cx-size*0.85, cy-size*0.3, cx, cy-size*0.95);
    ctx.bezierCurveTo(cx + size*0.85, cy-size*0.3, cx+size*0.7, cy+size*0.4, cx, cy+size*0.9);
    ctx.closePath();
    ctx.fillStyle = edgeGrad;
    ctx.fill();

    // Tip glow
    const tipGlow = ctx.createRadialGradient(cx, cy - size * 0.88, 0, cx, cy - size * 0.88, size * 0.35);
    tipGlow.addColorStop(0,   'rgba(255,200,200,0.5)');
    tipGlow.addColorStop(1,   'rgba(255,150,150,0)');
    ctx.fillStyle = tipGlow;
    ctx.fill();

    ctx.restore();
  }
</script>
